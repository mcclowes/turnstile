name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Warns without failing until the codebase has been formatted once (#26); then add --strict.
      - name: swift format lint
        run: swift format lint --recursive --parallel Sources Tests Package.swift

  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Unit tests with coverage
        run: |
          set -o pipefail
          ./scripts/coverage.sh | tee "$RUNNER_TEMP/coverage.txt"
          { echo '### Coverage'; echo '```'; grep -E '^(Filename|TOTAL)' "$RUNNER_TEMP/coverage.txt"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .build/coverage.lcov
      - name: End-to-end tests
        run: ./scripts/e2e.sh
      - name: Release build
        run: swift build -c release
      - name: Menu bar app
        run: ./scripts/package.sh --dev
