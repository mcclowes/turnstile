name: Nightly automation checks

on:
  push:
    branches: [main]
    paths: ["scripts/nightly-*", ".github/nightly*", ".github/workflows/nightly*", ".github/workflows/release.yml"]
  pull_request:
    paths: ["scripts/nightly-*", ".github/nightly*", ".github/workflows/nightly*", ".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node --test scripts/nightly-release.test.mjs
