name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: End-to-end tests
        run: ./scripts/e2e.sh
      - name: Release build
        run: swift build -c release
      - name: Menu bar app
        run: ./scripts/package.sh --dev
