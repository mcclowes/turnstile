name: Release

# Pushing a v<version> tag releases it, as scripts/release.sh does by hand: tests, builds the universal CLI tarball
# and the notarized Turnstile.app, attests both, publishes them here and on the tap, and updates the formula and cask.
# Running it by hand builds, signs, notarizes, and uploads the artifacts to the run, without attesting or publishing,
# to check the signing secrets. The secrets are listed in website/docs/development.md.

on:
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false
      candidate:
        type: string
        default: ""
      fingerprint:
        type: string
        default: ""
      nightly_tag:
        type: string
        default: ""
      nightly_version:
        type: string
        default: ""
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      deployments: write
      id-token: write
      attestations: write
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
      GITHUB_TOKEN: ${{ github.token }}
      NIGHTLY_SHA: ${{ inputs.candidate }}
      NIGHTLY_FINGERPRINT: ${{ inputs.fingerprint }}
      NIGHTLY_TAG: ${{ inputs.nightly_tag }}
      NIGHTLY_VERSION: ${{ inputs.nightly_version }}
      NIGHTLY_TAP_PATH: ${{ github.workspace }}/nightly-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Check the tag and the changelog
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/.*public static let version = "\(.*\)"/\1/p' Sources/TurnstileCore/Paths.swift)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match Turnstile.version $version"
            exit 1
          fi
          ./scripts/publish.sh --check

      - name: Dependency licenses
        run: node scripts/license-check.mjs
      - name: Unit tests
        run: swift test
      - name: End-to-end tests
        run: ./scripts/e2e.sh

      - name: Import the signing certificate and notary key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" \
            || { echo "::error::no Developer ID Application identity in DEVELOPER_ID_P12_BASE64"; exit 1; }

          # package.sh notarizes with the kiln-notary profile, as on the maintainer's Mac.
          echo "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials kiln-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" --keychain "$keychain" >/dev/null
          rm "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, and notarize
        run: ./scripts/dist.sh

      - name: Extract the CLI for attestation
        run: |
          mkdir "$RUNNER_TEMP/cli"
          tar -xzf .build/dist/turnstile-*-macos.tar.gz -C "$RUNNER_TEMP/cli"

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .build/dist/turnstile-*-macos.tar.gz
            .build/dist/Turnstile-*.zip
            ${{ runner.temp }}/cli/turnstile

      - name: Publish
        if: ${{ !inputs.nightly && (env.PUBLISH == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          gh auth setup-git
          ./scripts/publish.sh

      - name: Upload the artifacts to the run
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: .build/dist/

      - name: Check out the nightly tap
        if: ${{ inputs.nightly }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mcclowes/homebrew-turnstile
          path: nightly-tap
          ref: main
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Publish the verified nightly
        if: ${{ inputs.nightly }}
        env:
          TAP_GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: node scripts/nightly-release.mjs publish

      - name: Remove the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
