version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    groups:
      docusaurus:
        patterns: ["@docusaurus/*"]
      # react-dom pins an exact react peer; separate bumps fail npm ci.
      react:
        patterns: ["react", "react-dom"]
