name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "version = \"$version\"" Sources/TurnstileCore/Paths.swift || {
            echo "Tag $GITHUB_REF_NAME doesn't match Turnstile.version in Sources/TurnstileCore/Paths.swift"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: swift test && ./scripts/e2e.sh

      - name: Build a universal binary
        run: |
          swift build -c release --product turnstile --arch arm64 --arch x86_64
          bin="$(swift build -c release --product turnstile --arch arm64 --arch x86_64 --show-bin-path)"
          lipo -info "$bin/turnstile"
          [ "$("$bin/turnstile" --version)" = "$VERSION" ]
          mkdir dist
          tar -czf "dist/turnstile-$VERSION-macos.tar.gz" -C "$bin" turnstile
          ./scripts/formula.sh "$VERSION" "dist/turnstile-$VERSION-macos.tar.gz" > dist/turnstile.rb
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "turnstile $VERSION" --generate-notes

      # This repo is its own tap: `brew tap mcclowes/turnstile https://github.com/mcclowes/turnstile`.
      - name: Update the Homebrew formula on main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p Formula
          cp dist/turnstile.rb Formula/turnstile.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/turnstile.rb
          git commit -m "Chore: Homebrew formula for turnstile $VERSION"
          git push origin main
