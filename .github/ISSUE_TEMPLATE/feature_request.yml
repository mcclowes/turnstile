name: Feature request
description: A change to what turnstile gates, how it schedules, or how it reports.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong, or what's missing, today? Concrete commands and setups help most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you'd want turnstile to behave instead.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: Config, `turnstile run`, or anything else you've tried.
